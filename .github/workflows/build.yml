# Windows + Linux installers, built and TESTED on GitHub's own machines (owner, 2026-11-13).
#
# SOURCE OF TRUTH: 3D_BACKUP desktop/tools/cloud-build.yml. desktop/tools/release.mjs copies it to the public binaries
# repo (aevinite/aevidine-apps, aevinite/campus-apps) as .github/workflows/build.yml whenever it differs, pushes the
# desktop app's source to the `shell` branch there, and starts this run for one release tag. Public repos run GitHub's
# machines for free, so the Mac needs no Rosetta and no Windows PC is involved.
#
# Each platform: install the packages, build, INSTALL/OPEN the app and check it reaches its site's page (a broken build
# never reaches the release), then upload the files to that release. Unsigned: Windows SmartScreen / Smart App Control
# may warn — the Microsoft Store copy (docs/MICROSOFT-STORE.md) is the signed route: the Windows run also makes that
# Store package (.appx) for every app that has a Store identity, and adds it to the same release.
name: Build Windows and Linux
run-name: "${{ inputs.tag }} · Windows + Linux"
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to add the installers to (e.g. v1.0.455164)", required: true }
      ref: { description: "Commit on the shell branch that holds this release's app source", required: true }
      site: { description: "The site the app opens (the test checks the app reaches it)", required: true }
permissions:
  contents: write
concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      SITE: ${{ inputs.site }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }

      - name: Install the app's packages
        working-directory: src
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: src
        shell: bash
        run: |
          V="${TAG#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then P=--win; else P=--linux; fi
          npx electron-builder $P --publish never "-c.extraMetadata.version=$V"
          ls -la dist

      - name: Test — install and open the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/dist -Filter *Setup*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $pn = (Get-Content src/package.json -Raw | ConvertFrom-Json).productName
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$pn.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "The installer did not install the app." }
          "Installed: $($app.FullName)"
          $p = Start-Process $app.FullName -ArgumentList '--remote-debugging-port=9333' -PassThru
          $origin = ([Uri]$env:SITE).GetLeftPart('Authority')
          $ok = $false
          for ($i = 0; $i -lt 45 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $pages = Invoke-RestMethod http://127.0.0.1:9333/json -TimeoutSec 3 } catch { continue }
            $page = $pages | Where-Object { $_.type -eq 'page' } | Select-Object -First 1
            if ($page) { "Open page: $($page.url) — $($page.title)"; $ok = $page.url.StartsWith($origin) }
          }
          Get-Process | Where-Object { $_.Path -eq $app.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The app did not reach $origin." }
          "OK: the Windows app installs, opens and reaches its site."

      # THE IN-APP UPDATE, proved before anything is published (owner, 2026-11-13: "updates inside the app; this type of
      # error should not happen when I publish"). Builds the same app once more as the next version, serves it on this
      # machine, and lets the version just installed above update ITSELF (updater.js test switches: own profile,
      # hidden window, no click, no reopening). Passes only when the installed app's version is the next one.
      - name: Test — the Windows app updates itself
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v'); $p = $v.Split('.'); $next = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          Push-Location src
          npx electron-builder --win nsis --publish never "-c.extraMetadata.version=$next" "-c.directories.output=../dist-next"
          Pop-Location
          if (-not (Test-Path dist-next/latest.yml)) { throw "The next version has no latest.yml." }
          $srv = Start-Process python -ArgumentList '-m','http.server','9480','--bind','127.0.0.1','--directory','dist-next' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $pn = (Get-Content src/package.json -Raw | ConvertFrom-Json).build.productName
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$pn.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "The installed app is gone." }
          # The real installed version: Windows' list of installed apps. (The .exe's own "file version" can't hold a part
          # above 65535, so 1.0.456143 shows there as 1.0.65535.0 — useless for this check.)
          function Installed-Version { (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "$pn*" } | Select-Object -First 1).DisplayVersion }
          $before = Installed-Version
          "Before: $before"
          if ($before -ne $v) { throw "Installed version is $before, expected $v." }
          $env:AEVI_UPDATE_FEED = "http://127.0.0.1:9480"; $env:AEVI_UPDATE_AUTO = "1"; $env:AEVI_UPDATE_NO_RELAUNCH = "1"
          $env:AEVI_UPDATE_TEST_HIDDEN = "1"; $env:AEVI_USER_DATA = "$env:RUNNER_TEMP\aevi-update-profile"
          Start-Process $app.FullName
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 2
            $ver = Installed-Version
            if ($ver -eq $next) { $ok = $true }
          }
          Get-Process | Where-Object { $_.Path -eq $app.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist-next -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The app did not update itself to $next (it says $ver)." }
          "OK: the Windows app $v updated itself to $next inside the app."

      - name: Test — the Linux app updates itself
        if: runner.os == 'Linux'
        shell: bash
        run: |
          V="${TAG#v}"; NEXT="${V%.*}.$(( ${V##*.} + 1 ))"
          (cd src && npx electron-builder --linux AppImage --publish never "-c.extraMetadata.version=$NEXT" "-c.directories.output=../dist-next")
          test -f dist-next/latest-linux.yml || { echo "The next version has no latest-linux.yml."; exit 1; }
          python3 -m http.server 9480 --bind 127.0.0.1 --directory dist-next >/dev/null 2>&1 &
          SRV=$!; sleep 2
          WORK="$RUNNER_TEMP/aevi-update"; mkdir -p "$WORK"
          cp "$(ls src/dist/*.AppImage | head -1)" "$WORK/app.AppImage"; chmod +x "$WORK/app.AppImage"
          NEW_SUM=$(sha256sum "$(ls dist-next/*.AppImage | head -1)" | cut -d' ' -f1)
          AEVI_UPDATE_FEED=http://127.0.0.1:9480 AEVI_UPDATE_AUTO=1 AEVI_UPDATE_NO_RELAUNCH=1 AEVI_UPDATE_TEST_HIDDEN=1 \
            AEVI_USER_DATA="$WORK/profile" xvfb-run -a "$WORK/app.AppImage" --appimage-extract-and-run --no-sandbox >"$WORK/log.txt" 2>&1 &
          OK=0
          for i in $(seq 1 90); do
            sleep 2
            [ "$(sha256sum "$WORK/app.AppImage" 2>/dev/null | cut -d' ' -f1)" = "$NEW_SUM" ] && { OK=1; break; }
          done
          pkill -f "app.AppImage" || true; kill $SRV || true; rm -rf dist-next
          [ "$OK" = 1 ] || { tail -30 "$WORK/log.txt"; echo "The AppImage did not update itself to $NEXT."; exit 1; }
          echo "OK: the Linux app $V updated itself to $NEXT inside the app."

      # THE MICROSOFT STORE PACKAGE (docs/MICROSOFT-STORE.md) — only for an app whose package.json has a `build.appx`
      # section (the identity Partner Center gave its reserved name). Unsigned on purpose: the Store signs it, which is why
      # a Store install passes Smart App Control. The Store refuses any version part above 65535, so version 1.0.N is
      # packaged as 1.<N div 10000>.<N mod 10000>(.0) — the same number N, still rising with every release.
      - name: Build the Microsoft Store package
        if: runner.os == 'Windows'
        working-directory: src
        shell: bash
        run: |
          HAS=$(node -p 'Boolean(require("./package.json").build.appx)')
          if [ "$HAS" != "true" ]; then echo "No Store identity for this app — no Store package."; exit 0; fi
          N="${TAG##*.}"
          SV="1.$((10#$N / 10000)).$((10#$N % 10000))"
          echo "Store package version: $SV.0 (version $TAG)"
          npx electron-builder --win appx --publish never "-c.extraMetadata.version=$SV"
          A=$(ls dist/*.appx | head -1)
          # Check what Partner Center will check: the reserved identity, the version, and the sign-in address.
          unzip -p "$A" AppxManifest.xml > /tmp/manifest.xml
          ID=$(node -p 'require("./package.json").build.appx.identityName')
          grep -q "Name=\"$ID\"" /tmp/manifest.xml || { echo "Store package: wrong identity"; exit 1; }
          grep -q "Version=\"$SV.0\"" /tmp/manifest.xml || { echo "Store package: wrong version"; exit 1; }
          for SCHEME in $(node -p '(require("./package.json").build.protocols||[]).flatMap(p=>p.schemes).join(" ")'); do
            grep -q "Protocol Name=\"$SCHEME\"" /tmp/manifest.xml || { echo "Store package: sign-in address $SCHEME missing"; exit 1; }
          done
          echo "OK: $(basename "$A") — identity $ID, version $SV.0, sign-in address registered."

      - name: Test — open the Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          AI=$(ls src/dist/*.AppImage | head -1); chmod +x "$AI"
          ORIGIN=$(node -e 'console.log(new URL(process.env.SITE).origin)')
          xvfb-run -a "$AI" --appimage-extract-and-run --no-sandbox --remote-debugging-port=9333 >/tmp/app.log 2>&1 &
          OK=0
          for i in $(seq 1 45); do
            sleep 2
            # Not answering yet (still starting) is normal — keep asking (|| true: one refused connection must not end the test).
            URL=$(curl -s -m 3 http://127.0.0.1:9333/json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s).find(x=>x.type==="page");console.log(p?p.url:"")}catch{console.log("")}})') || true
            [ -n "$URL" ] && echo "Open page: $URL"
            case "$URL" in "$ORIGIN"*) OK=1; break;; esac
          done
          pkill -f "$(basename "$AI")" || true
          [ "$OK" = 1 ] || { tail -20 /tmp/app.log; echo "The app did not reach $ORIGIN."; exit 1; }
          echo "OK: the Linux app opens and reaches its site."

      - name: Add the installers to the release
        shell: bash
        run: |
          # Only the files this platform made (Windows has no latest-linux.yml and the other way round).
          FILES=()
          for f in src/dist/*.exe src/dist/*.exe.blockmap src/dist/*.appx src/dist/*.AppImage src/dist/*.deb src/dist/latest.yml src/dist/latest-linux.yml; do
            [ -f "$f" ] && FILES+=("$f")
          done
          [ ${#FILES[@]} -gt 0 ] || { echo "Nothing was built."; exit 1; }
          gh release upload "$TAG" "${FILES[@]}" --clobber -R "$GITHUB_REPOSITORY"
          printf '%s\n' "${FILES[@]##*/}"
